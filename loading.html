<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZYLO | Loading...</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #000000; color: #FFFFFF; }
        @keyframes pulse-slow {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(0.96); }
        }
        .animate-pulse-slow { animation: pulse-slow 2s infinite ease-in-out; }
    </style>
</head>
<body class="bg-black flex items-center justify-center min-h-screen select-none overflow-hidden">

    <div class="text-center space-y-6 px-4">
        <!-- Logo / Brand Name -->
        <div class="animate-pulse-slow">
            <h1 class="text-5xl sm:text-7xl font-black tracking-tighter uppercase">ZYLO</h1>
            <p class="text-[10px] sm:text-xs font-mono uppercase tracking-[0.4em] text-gray-400 mt-2">Monochrome Luxury & Streetwear</p>
        </div>

        <!-- Progress / Loading Bar -->
        <div class="w-48 sm:w-64 h-1 bg-gray-800 mx-auto rounded-full overflow-hidden relative">
            <div id="progress-bar" class="absolute top-0 left-0 h-full bg-white w-0 transition-all duration-[3000ms] ease-linear"></div>
        </div>

        <!-- Status Text -->
        <p class="text-[11px] font-mono tracking-widest text-gray-500 uppercase animate-pulse">Initializing Store Experience...</p>
    </div>

    <script>
        // Trigger smooth progress bar fill over 3 seconds
        window.addEventListener('load', () => {
            setTimeout(() => {
                document.getElementById('progress-bar').style.width = '100%';
            }, 50);

            // Redirect to index.html (or signup page if you prefer) after exactly 3 seconds
            setTimeout(() => {
                window.location.href = 'sigup.html'; // Agar signup page par bhejna ho toh yahan 'signup.html' likh sakti hain
            }, 3000);
        });
    </script>
</body>
</html>
